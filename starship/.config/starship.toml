"$schema" = 'https://starship.rs/config-schema.json'

palette = "mocha"
format = """
$username$hostname$directory$container$git_branch$git_status$python$cmd_duration$jobs
$character"""
right_format = "$time"
add_newline = true

[palettes.mocha]
base = "#1e1e2e"
text = "#cdd6f4"
mauve = "#cba6f7"
blue = "#89b4fa"
sapphire = "#74c7ec"
green = "#a6e3a1"
yellow = "#f9e2af"
peach = "#fab387"
red = "#f38ba8"
pink = "#f5c2e7"
lavender = "#b4befe"

[username]
show_always = true
style_user = "bold mauve"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
trim_at = "."
style = "bold mauve"
format = "[@$hostname]($style)"

[directory]
style = "bold blue"
truncation_length = 1
fish_style_pwd_dir_length = 1
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
format = " [$path$read_only]($style)"

[git_branch]
truncation_length = 16
truncation_symbol = "…"
symbol = ""
style = "bold green"
format = " [$symbol $branch]($style)"

[git_status]
style = "bold peach"
format = "([$all_status$ahead_behind]($style))"
conflicted = " ⚡"
ahead = " ⇡ ${count}"
behind = " ⇣ ${count}"
diverged = " ⇕ ⇡ ${ahead_count} ⇣ ${behind_count}"
up_to_date = ""
untracked = " ? ${count}"
stashed = " * ${count}"
modified = " ! ${count}"
staged = " + ${count}"
renamed = " » ${count}"
deleted = " × ${count}"

[character]
success_symbol = "[❯](bold mauve)[❯](bold sapphire)[❯](bold green)"
error_symbol = "[❯](bold red)[❯](bold peach)[❯](bold yellow)"
vimcmd_symbol = "[❮](bold green)"

[cmd_duration]
min_time = 4000
format = " [󰥔 $duration](bold peach)"

[jobs]
symbol = "✦"
style = "bold pink"
format = " [$symbol( $number)]($style)"

[time]
disabled = false
style = "lavender"
format = "[󰥔 $time]($style)"
time_format = "%H:%M"

[nodejs]
disabled = true

[package]
disabled = true

[container]
symbol = "⬢"
style = "bold red"
format = " [$symbol]($style)"

[python]
symbol = ""
style = "bold yellow"
format = ' [$symbol( $virtualenv)]($style)'
detect_extensions = []
detect_files = []
detect_folders = []
