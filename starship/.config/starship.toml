"$schema" = 'https://starship.rs/config-schema.json'

format = """
[$username]($style)[@](green)[konoha](bold green) [$directory]($style)$container$git_branch$git_status$python$cmd_duration$jobs
$character"""

right_format = """$time"""

add_newline = true

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
disabled = true

[directory]
style = "cyan"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
read_only = " 󰌾"
format = "[󰉋 $path]($style)[$read_only](bold red) "

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = ""
untracked = "?${count}"
stashed = "*${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 4000
format = "[󰥔 $duration](208) "

[jobs]
symbol = "✦ "
style = "bright-blue"
format = "[$symbol$number]($style) "

[time]
disabled = false
style = "bright-black"
format = "[$time]($style)"
time_format = "%H:%M"

[nodejs]
disabled = true
[package]
disabled = true

[container]
symbol = "⬢"
style = "bold red"
format = "[$symbol]($style) "

[python]
symbol = " "
style = "bold blue"
format = '[$symbol ]($style)'
detect_extensions = []
detect_files = []
detect_folders = []
