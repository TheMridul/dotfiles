<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Omarchy's /etc/fonts/conf.d/50-omarchy.conf pins sans-serif -> Liberation Sans
  with binding="strong". It arrived with omarchy-settings-dev and replaced the
  previous system default, which made UI/menu text look wrong.

  Matching on "sans-serif" here would do nothing: the /etc rule runs first and
  has already rewritten the family, so by this point the pattern no longer says
  "sans-serif". Match the substituted value instead.

  Swap the family below to taste (Cantarell, Open Sans, DejaVu Sans),
  then run: fc-cache -f
-->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any">
      <string>Liberation Sans</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>
</fontconfig>
