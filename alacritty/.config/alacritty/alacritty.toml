[general]
import = ["~/.local/state/omarchy/current/theme/alacritty.toml"]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "JetBrainsMono Nerd Font Mono" }
bold = { family = "JetBrainsMono Nerd Font Mono" }
italic = { family = "JetBrainsMono Nerd Font Mono" }
size = 9

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[[keyboard.bindings]]
key = "Insert"
mods = "Shift"
action = "Paste"

[[keyboard.bindings]]
key = "Insert"
mods = "Control"
action = "Copy"

# Send Shift+Return as CSI-u so TUIs (e.g. Claude Code) distinguish it from Return.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B[13;2u"

# Numpad Enter should behave exactly like regular Enter (some apps' TUIs,
# e.g. Claude Code, don't recognize the numpad-specific key/sequence otherwise).
[[keyboard.bindings]]
key = "NumpadEnter"
chars = "\r"
