# Flags for brave-origin. The launcher at /usr/bin/brave-origin reads this file,
# one flag per line; blank lines and # comments are skipped.

# Hardware video encode for calls and screen sharing. Chromium leaves VA-API
# encode off by default on Linux, so chrome://gpu reports "Video Encode:
# Software only" even though the Intel iGPU encodes H.264, HEVC and VP9 fine
# (verified with ffmpeg on /dev/dri/renderD129).
#
# Decode needs nothing here. It is on by default and works as long as
# LIBVA_DRIVER_NAME stays iHD -- see ~/.config/hypr/hyprland.lua.
--enable-features=AcceleratedVideoEncoder
