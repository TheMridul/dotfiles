[main]
include=~/.local/state/omarchy/current/theme/foot.ini
term=xterm-256color
font=Iosevka Nerd Font Mono:size=8
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[cursor]
style=block
blink=no

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

[colors-dark]
# Frosted glass: translucent background, text stays opaque. Blur needs
# decoration.blur enabled in hypr/looknfeel.lua.
alpha=0.8
blur=yes
alpha-mode=all

# Richer ANSI accents override the theme include above.
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
bright0=7f849c
bright1=eba0ac
bright2=94e2d5
bright3=fab387
bright4=74c7ec
bright5=f5c2e7
bright6=89dceb
bright7=f5e0dc
cursor=1e1e2e f5c2e7
selection-foreground=cdd6f4
selection-background=45475a
